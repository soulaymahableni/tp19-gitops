apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: whoami-prod

resources:
  - ../../base

labels:
  - pairs:
      environment: prod

replicas:
  - name: whoami
    count: 3

# Version déployée dans cet environnement : la promotion = changer ce tag par PR
images:
  - name: traefik/whoami
    newTag: v1.10.0

patches:
  - target:
      kind: Deployment
      name: whoami
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/env/0/value
        value: prod
