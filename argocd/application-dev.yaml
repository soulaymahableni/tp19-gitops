# Partie 2 : une Application = "déployer envs/dev du dépôt dans le namespace whoami-dev".
# Pas de synchronisation automatique au départ : on synchronise à la main (argocd app sync).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: whoami-dev
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/soulaymahableni/tp19-gitops.git
    targetRevision: main
    path: envs/dev
  destination:
    server: https://kubernetes.default.svc
    namespace: whoami-dev
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
    # Partie 3 : décommenter, commiter, puis kubectl apply -f argocd/application-dev.yaml
    # automated:
    #   prune: true
    #   selfHeal: true
