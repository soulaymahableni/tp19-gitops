# Partie 4 : une Application par dossier envs/* (whoami-dev, whoami-staging, whoami-prod).
# dev et staging : synchronisation automatique ; prod : synchronisation MANUELLE.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: whoami
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - git:
        repoURL: https://github.com/soulaymahableni/tp19-gitops.git
        revision: main
        directories:
          - path: envs/*
  template:
    metadata:
      name: 'whoami-{{.path.basename}}'
      labels:
        environment: '{{.path.basename}}'
    spec:
      project: default
      source:
        repoURL: https://github.com/soulaymahableni/tp19-gitops.git
        targetRevision: main
        path: '{{.path.path}}'
      destination:
        server: https://kubernetes.default.svc
        namespace: 'whoami-{{.path.basename}}'
      syncPolicy:
        syncOptions:
          - CreateNamespace=true
  # Ajouté seulement pour les environnements autres que prod
  templatePatch: |
    {{- if ne .path.basename "prod" }}
    spec:
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
    {{- end }}
